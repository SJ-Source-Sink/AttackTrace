# ─── Alembic Configuration ────────────────────────────────────────────────────
#
# This file is read by the `alembic` CLI.  Run from the platform/backend/
# directory (where this file lives):
#
#   alembic upgrade head         # apply all pending migrations
#   alembic revision --autogenerate -m "add findings table"
#   alembic downgrade -1         # roll back one revision
#   alembic history              # show all revisions
#   alembic current              # show currently applied revision
#
# The DATABASE_URL is resolved in alembic/env.py from the SYNC_DATABASE_URL
# environment variable (or DATABASE_URL with asyncpg stripped).
# The sqlalchemy.url value below is a fallback for local development when
# no environment variable is set.

[alembic]
# Path to migration scripts directory (relative to this file)
script_location = alembic

# Template for autogenerated revision filenames
# Format: {year}{month}{day}_{hour}{minute}_{rev}_{slug}.py
# Example: 20240315_1430_a3f9b2c1d4e5_add_findings_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Fallback DB URL — overridden in env.py by SYNC_DATABASE_URL env var.
# Change host to `localhost` for direct local migration outside Docker.
sqlalchemy.url = postgresql://attacktrace:attacktrace@localhost:5432/attacktrace

# Prepend sys.path with this path so `from app.xxx import` works when
# running alembic from the platform/backend/ directory
prepend_sys_path = .

# Timezone for revision timestamps in autogenerated migration files
timezone = UTC

# ─── Logging ──────────────────────────────────────────────────────────────────
# Standard Python logging configuration.
# Alembic logs migration progress; SQLAlchemy echo is controlled by DEBUG env var.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# Set to INFO to log all SQL statements (useful for debugging migrations)
# level = INFO

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
