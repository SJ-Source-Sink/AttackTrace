# ─── AttackTrace Backend API — Deployment + HPA + Service ───────────────────────────
#
# Resource sizing rationale:
#   requests: conservative enough for bin-packing on c5.xlarge nodes
#   limits:   API is mostly async I/O — CPU bursts during AI calls and crypto
#
# Rolling update strategy:
#   maxUnavailable: 0  — zero-downtime deploys; new pods must be Ready before
#                        old ones are removed
#   maxSurge: 1        — one extra pod during rollout to absorb traffic

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: attacktrace-platform
  annotations:
    # Trigger re-deploy when the ConfigMap changes (use Reloader or similar)
    configmap.reloader.stakater.com/reload: "attacktrace-config"
    secret.reloader.stakater.com/reload: "attacktrace-secrets"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      # Spread pods across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          # Replace with your registry path, e.g. ghcr.io/yourorg/attacktrace-backend:latest
          image: attacktrace-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: attacktrace-config
            - secretRef:
                name: attacktrace-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Startup probe gives the container up to 90 s to start before liveness kicks in
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: attacktrace-workspace
              mountPath: /tmp/attacktrace_scans
      volumes:
        - name: tmp
          emptyDir: {}
        - name: attacktrace-workspace
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Horizontal Pod Autoscaler
# Scale 2→10 replicas based on CPU utilization.
# The API is async I/O bound; CPU at 70% means uvicorn worker threads are busy.
# For more accurate scaling, add a custom metric from Prometheus (request rate).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Slow scale-down to avoid flapping during scan bursts
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
