# ─── AttackTrace — Kubernetes Secrets ──────────────────────────────────────
#
# THIS FILE IS A TEMPLATE.  Never commit real secret values to version control.
#
# Recommended workflow:
#   1. Use a secrets manager (Vault, AWS SSM, GCP Secret Manager) and an
#      operator (External Secrets Operator) to populate these automatically.
#   2. For manual bootstrapping, generate values and base64-encode them:
#        echo -n "my-secret-value" | base64
#   3. Apply with:
#        kubectl apply -f k8s/secrets.yaml -n attacktrace-platform
#
# All values below are base64-encoded placeholders — replace before applying.
# A placeholder value of "REPLACE_ME" encodes to: UkVQTEFDRV9NRQ==
#
# Generate recommended values:
#   SECRET_KEY:      openssl rand -hex 32 | base64
#   KMS_MASTER_KEY:  openssl rand -base64 32 | base64
#   DB password:     openssl rand -base64 16 | tr -dc 'a-zA-Z0-9' | head -c 20 | base64

apiVersion: v1
kind: Secret
metadata:
  name: easd-secrets
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: attacktrace-platform
    app.kubernetes.io/component: secrets
  annotations:
    # Annotate so External Secrets Operator can manage this if configured
    # externalsecrets.io/backend: "vault"
    # externalsecrets.io/path: "secret/easd/platform"
type: Opaque
data:
  # ── JWT signing key ──────────────────────────────────────────────────────────
  # openssl rand -hex 32 | base64 -w0
  SECRET_KEY: UkVQTEFDRV9NRQ==

  # ── Credential encryption master key (32-byte base64) ────────────────────────
  # openssl rand -base64 32 | base64 -w0
  KMS_MASTER_KEY: UkVQTEFDRV9NRQ==

  # ── PostgreSQL credentials ────────────────────────────────────────────────────
  POSTGRES_PASSWORD: UkVQTEFDRV9NRQ==
  # Full DATABASE_URL (overrides ConfigMap for auth) — base64 encoded full URL
  DATABASE_URL: UkVQTEFDRV9NRQ==
  SYNC_DATABASE_URL: UkVQTEFDRV9NRQ==

  # ── Anthropic API key ─────────────────────────────────────────────────────────
  # Obtain from https://console.anthropic.com/settings/keys
  ANTHROPIC_API_KEY: UkVQTEFDRV9NRQ==

  # ── Initial superuser (created by first-run seed job) ────────────────────────
  FIRST_SUPERUSER_EMAIL: YWRtaW5AZXhhbXBsZS5jb20=
  FIRST_SUPERUSER_PASSWORD: UkVQTEFDRV9NRQ==
