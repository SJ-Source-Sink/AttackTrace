# ─── MSRA — Mobile Security Review Assistant ─────────────────────────────────
#
# MSRA runs as a sidecar service alongside the AttackTrace backend.
# All traffic flows through the backend proxy (/api/v1/mobile/*) so
# MSRA is never exposed directly to the internet.
#
# Build the image:
#   docker build -t ghcr.io/yourorg/attacktrace-msra:latest https://github.com/BaymaxPop23/MSRA.git
#   docker push ghcr.io/yourorg/attacktrace-msra:latest
#
# Then update the image reference below.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: msra
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: msra
    app.kubernetes.io/component: mobile-scanner
    app.kubernetes.io/part-of: attacktrace-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msra
  strategy:
    type: Recreate   # SQLite DB — only one instance
  template:
    metadata:
      labels:
        app: msra
        app.kubernetes.io/name: msra
        app.kubernetes.io/component: mobile-scanner
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: msra
          # Replace with your registry image after building from github.com/BaymaxPop23/MSRA
          image: ghcr.io/yourorg/attacktrace-msra:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: PORT
              value: "5001"
            - name: FLASK_ENV
              value: "production"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: attacktrace-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/dashboard/stats
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/dashboard/stats
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # MSRA writes SQLite DB and extracted APK files
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: msra-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: msra-data
          persistentVolumeClaim:
            claimName: msra-data-pvc
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: msra
  namespace: attacktrace-platform
  labels:
    app.kubernetes.io/name: msra
    app.kubernetes.io/component: mobile-scanner
spec:
  type: ClusterIP
  selector:
    app: msra
  ports:
    - name: http
      port: 5001
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: msra-data-pvc
  namespace: attacktrace-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
